<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <title>WanderWise | Travel & Flight Planner Dashboard</title>
  <meta name="description"
    content="Plan your next trip with WanderWise. Get weather forecasts, currency conversion, and packing suggestions in one clean interface.">
  <meta name="keywords"
    content="travel planner, weather forecast, currency converter, trip planner, budget travel, digital nomad">
  <meta name="author" content="Moroni Aguilera">
  <meta name="robots" content="index, follow">


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Poppins:wght@600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/animations.css">
  <link rel="stylesheet" href="/styles/responsive.css">

  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">

  <link rel="preload" href="/styles/main.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <script type="module" src="/js/main.js"></script>
</head>

<body>
  <div id="header-placeholder"></div>

  <main id="explore" class="page-content">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow">Compare your next stops</p>
        <h1 id="hero-title">Explore two cities<br>before you go</h1>
        <p class="hero-description">
          Compare local weather and currency information<br class="desktop-break">
          for the cities on your itinerary.
        </p>
      </div>

      <div class="hero-art" role="img" aria-label="Illustration of mountains beneath the sun">
        <svg viewBox="0 0 320 220" aria-hidden="true">
          <circle class="sun" cx="236" cy="58" r="22" />
          <path class="mountain mountain-back" d="m35 177 82-105 47 62 36-45 86 88H35Z" />
          <path class="mountain mountain-front" d="m54 177 55-70 39 47 24-28 53 51H54Z" />
          <path class="snow" d="m109 107 8-11 9 12-7-3-5 5Zm50 27 5-7 6 8-5-2-4 3Z" />
        </svg>
      </div>
    </section>

    <div id="city-search-placeholder"></div>
  </main>
</body>
</html>
