<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <title>WanderWise | Travel & Flight Planner Dashboard</title>
  <meta name="description"
    content="Plan your next trip with WanderWise. Get weather forecasts, currency conversion, and packing suggestions in one clean interface.">
  <meta name="keywords"
    content="travel planner, weather forecast, currency converter, trip planner, budget travel, digital nomad">
  <meta name="author" content="Moroni Aguilera">
  <meta name="robots" content="index, follow">


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Poppins:wght@600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/animations.css">
  <link rel="stylesheet" href="/styles/responsive.css">

  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">

  <link rel="preload" href="/styles/main.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
</head>

<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="WanderWise home">
      <svg class="brand-mark" viewBox="0 0 48 36" aria-hidden="true">
        <path d="M2 31 15 12l7 10 7-17 17 26H2Z" />
        <path d="m10 20 5 4 4-5m5 5 5-5 5 5m3 2 4-4 4 6" />
      </svg>
      <span>WanderWise</span>
    </a>

    <nav class="main-nav" aria-label="Main navigation">
      <a href="#explore">Explore</a>
      <a href="#flight-search">Flights</a>
      <a href="#trip-type">Trips</a>
    </nav>

    <a class="account-link" href="#account" aria-label="Your account">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="3.5" />
        <path d="M5 21v-2a7 7 0 0 1 14 0v2Z" />
      </svg>
    </a>
  </header>

  <main id="explore" class="page-content">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow">Find your next getaway</p>
        <h1 id="hero-title">Your next adventure<br>is closer than you think</h1>
        <p class="hero-description">
          Find the best flights, plan your trip,<br class="desktop-break">
          and explore the world with WanderWise.
        </p>
      </div>

      <div class="hero-art" role="img" aria-label="Illustration of mountains beneath the sun">
        <svg viewBox="0 0 320 220" aria-hidden="true">
          <circle class="sun" cx="236" cy="58" r="22" />
          <path class="mountain mountain-back" d="m35 177 82-105 47 62 36-45 86 88H35Z" />
          <path class="mountain mountain-front" d="m54 177 55-70 39 47 24-28 53 51H54Z" />
          <path class="snow" d="m109 107 8-11 9 12-7-3-5 5Zm50 27 5-7 6 8-5-2-4 3Z" />
        </svg>
      </div>
    </section>

    <section id="flight-search" class="search-panel" aria-label="Search for flights">
      <form>
        <fieldset id="trip-type" class="trip-options">
          <legend class="visually-hidden">Trip type</legend>
          <label class="trip-option">
            <input type="radio" name="trip-type" value="round-trip" checked>
            <span>Round trip</span>
          </label>
          <label class="trip-option">
            <input type="radio" name="trip-type" value="one-way">
            <span>One way</span>
          </label>
          <label class="trip-option">
            <input type="radio" name="trip-type" value="multi-city">
            <span>Multi-city</span>
          </label>
        </fieldset>

        <div class="search-fields">
          <label class="search-field">
            <span class="field-label">From</span>
            <input type="text" name="origin" placeholder="City or airport" autocomplete="off">
          </label>
          <label class="search-field">
            <span class="field-label">To</span>
            <input type="text" name="destination" placeholder="City or airport" autocomplete="off">
          </label>
          <label class="search-field">
            <span class="field-label">Departure</span>
            <input type="date" name="departure">
          </label>
          <label class="search-field">
            <span class="field-label">Return</span>
            <input type="date" name="return">
          </label>
          <button class="search-button" type="submit">Search flights</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
