<section id="city-search" class="search-panel" aria-label="Compare two cities">
  <form action="/city-results.html" method="get">
    <div class="search-fields">
      <div class="floating-input">
        <input type="text" name="city1" id="city1" placeholder=" " autocomplete="off" required>
        <label for="city1" class="floating-label">First city</label>
      </div>
      <div class="floating-input">
        <input type="text" name="city2" id="city2" placeholder=" " autocomplete="off" required>
        <label for="city2" class="floating-label">Second city</label>
      </div>
      <button class="search-button" type="submit">Compare cities</button>
    </div>
  </form>
</section>
